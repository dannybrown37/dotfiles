repos:
  # ruff and pytest live in git-a-grip so every repo shares one copy, rather
  # than each keeping its own `bash -c '... && git add "$@"'` wrapper.
  - repo: https://github.com/dannybrown37/git-a-grip
    rev: v0.11.1
    hooks:
      - id: ruff-check
        args: [--config, config/.ruff.toml]
      - id: ruff-format
        args: [--config, config/.ruff.toml]
      - id: pytest
        args: ['--runner=uv run --with pytest pytest', scripts/, -q]
        files: ^scripts/.*\.py$
      # Replaces scripts/sync-readme-make.sh. The hook ships always_run,
      # which would shell out to make on every commit; the help text is
      # written entirely in the Makefile, so scope it to that and the README.
      - id: embed-command
        args: ['--marker=make', '--command=make --no-print-directory help']
        always_run: false
        files: ^(Makefile|README\.md)$
      - id: block-private-terms

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "4"]

  - repo: https://github.com/gitleaks/gitleaks
    # autoupdate resolves this repo one tag low; v8.30.1 is the latest release.
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Upstream's hook is docker_image only, and this machine's docker daemon
      # rejects container create. shellcheck comes from install/apt_packages.sh,
      # and .shellcheckrc at the repo root carries the deliberate disables.
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: sync-readme-commands
        name: Sync README @doc commands
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/sync-readme-commands.sh && git add README.md'
        language: system
        files: (config/\.bash_aliases|bin/.*\.sh|scripts/.*\.sh|README\.md)$
        pass_filenames: false

      - id: sync-readme-structure
        name: Sync README directory structure
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/sync-readme-structure.sh && git add README.md'
        language: system
        files: (\.dirdesc|README\.md)$
        pass_filenames: false

      - id: check-dirdesc
        name: Require .dirdesc in all directories
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/check-dirdesc.sh'
        language: system
        always_run: true
        pass_filenames: false

      - id: check-symlink-helper
        name: Require link_config for config symlinks
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/check-symlink-helper.sh'
        language: system
        files: ^install/.*\.sh$
        pass_filenames: false
