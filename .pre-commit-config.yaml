repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-i", "4"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check --fix --config config/.ruff.toml
        language: system
        types: [python]
        exclude: ^gtd/
        pass_filenames: true

      - id: ruff-check-gtd
        name: Ruff check (gtd/)
        entry: ruff check --fix
        language: system
        types: [python]
        files: ^gtd/
        pass_filenames: true

      - id: ruff-format
        name: Ruff format
        entry: bash -c 'ruff format --config config/.ruff.toml "$@" && git add "$@"' --
        language: system
        types: [python]
        exclude: ^gtd/
        pass_filenames: true
        require_serial: true

      - id: ruff-format-gtd
        name: Ruff format (gtd/)
        entry: bash -c 'ruff format "$@" && git add "$@"' --
        language: system
        types: [python]
        files: ^gtd/
        pass_filenames: true
        require_serial: true

      - id: sync-readme-commands
        name: Sync README @doc commands
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/sync-readme-commands.sh && git add README.md'
        language: system
        files: (config/\.bash_aliases|bin/.*\.sh|scripts/.*\.sh|README\.md)$
        pass_filenames: false

      - id: sync-readme-structure
        name: Sync README directory structure
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/sync-readme-structure.sh && git add README.md'
        language: system
        files: (\.dirdesc|README\.md)$
        pass_filenames: false

      - id: check-dirdesc
        name: Require .dirdesc in all directories
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/check-dirdesc.sh'
        language: system
        always_run: true
        pass_filenames: false

      - id: check-claude-symlinks
        name: Check Claude Code CLAUDE.md and skills symlinks
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/check-claude-symlinks.sh'
        language: system
        always_run: true
        pass_filenames: false

      - id: check-privacy-terms
        name: Check privacy terms
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/check-privacy-terms.sh'
        language: system
        always_run: true
        pass_filenames: false

      - id: check-skill-structure
        name: Check skill frontmatter and bundled resources
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/check_skill_structure.py'
        language: system
        always_run: true
        pass_filenames: false

      - id: sync-readme-make
        name: Sync README make output
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/sync-readme-make.sh && git add README.md'
        language: system
        files: (Makefile|README\.md)$
        pass_filenames: false

      - id: sync-gtd-readme
        name: Sync GTD README menu
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/gtd" && uv run python scripts/update_readme.py && git add README.md'
        language: system
        files: ^gtd/(src/gtd/cli\.py|README\.md)$
        pass_filenames: false

      - id: gtd-tests
        name: GTD tests
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/gtd" && uv run pytest tests/ -q'
        language: system
        files: ^gtd/(?!\.venv/).*
        pass_filenames: false

      - id: scripts-tests
        name: scripts/ tests
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv run --with pytest pytest scripts/ -q'
        language: system
        files: ^scripts/.*\.py$
        pass_filenames: false
