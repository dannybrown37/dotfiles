name: prek autoupdate

# Dependabot covers .github/workflows only -- there is no pre-commit ecosystem.
# This is the hook-rev equivalent: bump the pinned revs monthly, open a PR.

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install prek
        run: |
          uv tool install prek
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bump hook revs
        run: prek update

      - name: Run hooks against the new revs
        run: prek run --all-files
        env:
          SKIP: pytest

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/prek-autoupdate
          title: "chore: prek autoupdate"
          commit-message: "chore: prek autoupdate"
          delete-branch: true
          body: |
            Monthly `prek update`. Hooks passed against the new revs in
            this run.

            Check each rev by hand before merging: `update` resolves some
            repos to a tag below their latest release (gitleaks does this), so a
            bump here can be a downgrade.

            CI does not run on this PR -- it is authored by `GITHUB_TOKEN`. The
            "Run hooks" step above is the substitute; close and reopen the PR if
            you want the full workflow set.
