name: CI

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install ruff and pre-commit
        run: |
          # Pinned to match install/python.sh -- keeps CI and local dev in lockstep.
          uv tool install "ruff==0.16.0"
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gtd-tests,scripts-tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Run gtd tests
        working-directory: gtd
        run: uv run --extra api pytest --cov=src --cov-report=term-missing tests/

      - name: Run scripts tests
        run: uv run --with pytest --with pytest-cov pytest --cov=scripts --cov-report=term-missing scripts/
