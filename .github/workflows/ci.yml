name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install ruff and pre-commit
        run: |
          # Both pinned to match install/python.sh -- keeps CI and local dev in
          # lockstep. Bump in both places together.
          uv tool install "ruff==0.16.0"
          uv tool install "pre-commit==4.6.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          # ci.yml is in the key because it carries the pre-commit pin -- a major
          # bump rebuilds every hook env, so a cache keyed only on the hook config
          # would restore envs built by the previous runner.
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.github/workflows/ci.yml') }}

      # The pytest hook duplicates the `test` job below; skip it by hook id.
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run scripts tests
        run: uv run --with pytest --with pytest-cov pytest --cov=scripts --cov-report=term-missing scripts/
